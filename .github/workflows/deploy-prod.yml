name: Deploy prod

# Deploys a version tag vX.Y.Z to production (ADR 0008), then creates its
# GitHub Release. Versions stay at 0.x until the cut-over, which is 1.0.0. It
# can also be run by hand on an existing tag, for example to retry a deploy;
# any other ref is refused (scripts/deploy/check-ref.sh).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# One deploy to production at a time. A running deploy is never cancelled.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

env:
  # Install without the git hooks that `vp config` sets up in `prepare`.
  VP_GIT_HOOKS: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: prod
      url: ${{ steps.check-build.outputs.site-url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: scripts/deploy/check-ref.sh prod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The organisation allows only GitHub-owned actions, so Vite+ comes from npm.
      - run: npm install --global vite-plus@1.1.0 # zizmor: ignore[adhoc-packages] exact version; the lockfile pins everything else
      - run: vp install --frozen-lockfile
      # The build needs no secrets and no database. It is checked before
      # anything changes, so a placeholder Hyperdrive id stops the run here.
      - name: Build for prod
        env:
          CLOUDFLARE_ENV: prod
        run: ./node_modules/.bin/vp run build
      - name: Check the build
        id: check-build
        run: scripts/deploy/check-build.sh prod
      # No seed: seeds never run against prod.
      # The target database may hold a zone the admin added from the panel, so
      # the catalogues it already has plus the pending migrations are checked
      # before anything is applied: the check runs them in a transaction and
      # rolls it back, and a conflict stops the deploy (docs/specs/data-model.md,
      # "The slugs of the catalogues do not produce ambiguous URLs at the root
      # of a locality (v2)").
      - name: Check the catalogue URLs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-catalogue-urls.ts
      - name: Apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./node_modules/.bin/vp run db:migrate
      # Wrangler checks that CLOUDFLARE_ENV matches the environment of the build.
      # The Worker secrets travel with the deploy (ADR 0020), written to a file
      # of the runner's temporary directory that the script removes.
      - name: Deploy
        env:
          CLOUDFLARE_ENV: prod
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MEDIA_ZONE_ID: ${{ secrets.MEDIA_ZONE_ID }}
          MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.MEDIA_CACHE_PURGE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: scripts/deploy/deploy-worker.sh prod
      - name: Smoke test
        env:
          SITE_URL: ${{ steps.check-build.outputs.site-url }}
        run: scripts/deploy/smoke-test.sh "${SITE_URL}"

  release:
    name: release
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: write # the only job that writes to the repository: it creates the Release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} already exists."
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --generate-notes --title "${TAG}"
