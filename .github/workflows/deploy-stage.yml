name: Deploy stage

# Deploys main to stage on every push to main (ADR 0008); the ruleset of main
# already requires the CI before a merge. It can also be run by hand on main,
# for example after the configuration of stage changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy to stage at a time. A running deploy is never cancelled; when
# several merges queue up, the newest waiting run replaces the older ones.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

permissions: {}

env:
  # Install without the git hooks that `vp config` sets up in `prepare`.
  VP_GIT_HOOKS: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: stage
      url: ${{ steps.check-build.outputs.site-url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: scripts/deploy/check-ref.sh stage
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The organisation allows only GitHub-owned actions, so Vite+ comes from npm.
      - run: npm install --global vite-plus@1.1.0 # zizmor: ignore[adhoc-packages] exact version; the lockfile pins everything else
      - run: vp install --frozen-lockfile
      # The build needs no secrets and no database. It is checked before
      # anything changes, so a placeholder Hyperdrive id stops the run here.
      - name: Build for stage
        env:
          CLOUDFLARE_ENV: stage
        run: ./node_modules/.bin/vp run build
      - name: Check the build
        id: check-build
        run: scripts/deploy/check-build.sh stage
      - name: Apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./node_modules/.bin/vp run db:migrate
      # The seed draws the photos of its fictitious cards into a directory;
      # the next step, the only one with the R2 token, uploads them to the
      # media bucket that dev and stage share (ADR 0011).
      - name: Seed the fictitious data
        env:
          ENVIRONMENT: stage
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_MEDIA_DIR: ${{ runner.temp }}/seed-media
        run: ./node_modules/.bin/vp run db:seed
      - name: Upload the seeded photos
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEED_MEDIA_DIR: ${{ runner.temp }}/seed-media
        run: scripts/deploy/upload-seed-media.sh stage "${SEED_MEDIA_DIR}"
      # Wrangler checks that CLOUDFLARE_ENV matches the environment of the build.
      - name: Deploy
        env:
          CLOUDFLARE_ENV: stage
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy
      - name: Smoke test
        env:
          SITE_URL: ${{ steps.check-build.outputs.site-url }}
        run: scripts/deploy/smoke-test.sh "${SITE_URL}"
