name: Deploy dev

# Deploys the branch this workflow is run from to dev (ADR 0008): Actions >
# Deploy dev > Run workflow > pick the branch. Before deploying it resets the
# Neon dev branch from stage, applies the branch's migrations and seeds the
# fictitious data, so whatever was stored in dev is lost.
on:
  workflow_dispatch:

# One deploy to dev at a time. A running deploy is never cancelled; a newer
# run waits for it.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions: {}

env:
  # Install without the git hooks that `vp config` sets up in `prepare`.
  VP_GIT_HOOKS: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: dev
      url: ${{ steps.check-build.outputs.site-url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: scripts/deploy/check-ref.sh dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The organisation allows only GitHub-owned actions, so Vite+ comes from npm.
      - run: npm install --global vite-plus@1.1.0 # zizmor: ignore[adhoc-packages] exact version; the lockfile pins everything else
      - run: vp install --frozen-lockfile
      # The build needs no secrets and no database. It is checked before
      # anything changes, so a placeholder Hyperdrive id stops the run here.
      - name: Build for dev
        env:
          CLOUDFLARE_ENV: dev
        run: ./node_modules/.bin/vp run build
      - name: Check the build
        id: check-build
        run: scripts/deploy/check-build.sh dev
      - name: Reset the Neon dev branch from stage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: scripts/deploy/reset-neon-dev.sh
      - name: Apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./node_modules/.bin/vp run db:migrate
      # The seed draws the photos of its fictitious cards into a directory;
      # the next step, the only one with the R2 token, uploads them to the
      # media bucket that dev and stage share (ADR 0011).
      - name: Seed the fictitious data
        env:
          ENVIRONMENT: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_MEDIA_DIR: ${{ runner.temp }}/seed-media
        run: ./node_modules/.bin/vp run db:seed
      - name: Upload the seeded photos
        env:
          MEDIA_R2_ACCESS_KEY_ID: ${{ secrets.MEDIA_R2_ACCESS_KEY_ID }}
          MEDIA_R2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEED_MEDIA_DIR: ${{ runner.temp }}/seed-media
        run: scripts/deploy/upload-seed-media.sh dev "${SEED_MEDIA_DIR}"
      # Wrangler checks that CLOUDFLARE_ENV matches the environment of the build.
      - name: Deploy
        env:
          CLOUDFLARE_ENV: dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: >-
          ./node_modules/.bin/wrangler deploy
          --var "DEPLOY_BRANCH:${DEPLOY_BRANCH}"
          --var "DEPLOY_COMMIT:${GITHUB_SHA}"
      - name: Smoke test
        env:
          SITE_URL: ${{ steps.check-build.outputs.site-url }}
        run: scripts/deploy/smoke-test.sh "${SITE_URL}"
      - name: Write the run summary
        env:
          SITE_URL: ${{ steps.check-build.outputs.site-url }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Deployed to dev"
            echo
            echo "- URL: ${SITE_URL}"
            echo "- Branch: \`${DEPLOY_BRANCH}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
