# Other protections (install scripts blocked, 24-hour minimumReleaseAge,
# blockExoticSubdeps, unknown settings rejected) are pnpm 12 defaults.
# Vite+ manages Node.js from devEngines.runtime, so pnpm does not.
runtimeOnFail: ignore
saveExact: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Published in 2024 by its maintainer without provenance (4.0.1 had it).
  # @astrojs/check needs ^4.0.3.
  - chokidar@4.0.3
allowBuilds:
  esbuild: true
  workerd: true
# The toolchain catalog: one Vite (Vite+ core) and one Vitest (the one Vite+
# bundles) in the whole tree. Upgrade the three entries together.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.3.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
# Vite+ core reports its own version (1.x), not Vite's (8.x).
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
